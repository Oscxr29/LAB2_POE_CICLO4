<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>Gestor de tareas</title>
  </head>
  <body>
    <main class="app">
      <header class="cabecera">
        <div>
          <h1>Gestor de tareas</h1>
          <p id="contador-prioridad" class="contador" aria-live="polite"></p>
        </div>
        <p id="contador" class="contador" aria-live="polite"></p>
      </header>

      <form id="form-tarea" class="nueva" autocomplete="off">
        <input id="input-titulo" type="text" placeholder="¿Qué hay que hacer?" maxlength="120" required />

        <select id="select-categoria" required aria-label="Categoría">
          <option value="" disabled selected>Categoría...</option>
          <option value="estudio">Estudio</option>
          <option value="trabajo">Trabajo</option>
          <option value="personal">Personal</option>
        </select>

        <input id="input-fecha-limite" type="date" required aria-label="Fecha límite" />

        <select id="select-prioridad" aria-label="Prioridad">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>

        <button id="btn-submit" type="submit">Agregar</button>
        <button id="btn-cancelar" type="button" class="secundario" hidden>Cancelar</button>
        <p id="error-titulo" class="error" role="alert" hidden></p>
      </form>

      <section class="filtros" aria-label="Filtros y orden">
        <label class="buscador">
          Buscar tarea
          <input id="input-buscar" type="search" placeholder="Escribe para buscar..." />
        </label>

        <label>
          Prioridad
          <select id="filtro-prioridad">
            <option value="todas">Todas</option>
            <option value="alta">Alta</option>
            <option value="media">Media</option>
            <option value="baja">Baja</option>
          </select>
        </label>

        <label>
          Estado
          <select id="filtro-estado">
            <option value="todas">Todas</option>
            <option value="pendientes">Pendientes</option>
            <option value="completadas">Completadas</option>
          </select>
        </label>

        <label>
          Categoría
          <select id="filtro-categoria">
            <option value="todas">Todas</option>
            <option value="estudio">Estudio</option>
            <option value="trabajo">Trabajo</option>
            <option value="personal">Personal</option>
          </select>
        </label>

        <label>
          Ordenar por
          <select id="select-orden">
            <option value="prioridad">Prioridad</option>
            <option value="fecha">Más recientes</option>
            <option value="titulo">Título (A-Z)</option>
          </select>
        </label>
      </section>

      <ul id="lista-tareas" class="lista" aria-live="polite"></ul>
      <p id="estado-vacio" class="vacio">No hay tareas que mostrar.</p>
    </main>

    <dialog id="dialogo-confirmar" class="dialogo">
      <h2>¿Eliminar tarea?</h2>
      <p id="dialogo-texto"></p>
      <form method="dialog" class="dialogo-acciones">
        <button value="cancelar" class="secundario">Cancelar</button>
        <button value="confirmar" class="peligro">Eliminar</button>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
